<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
		<div>
			<label for="name">Name</label>
			 <input type="text" id="name" required/>
		</div>
		<div>
			<label for="email">Email</label>
			 <input type="email" id="email" required/>
		</div>
		<div>
			<p>Choose gender</p>
			<label for="gender_m">Male</label>
			 <input type="radio" name="gender" id="gender_m" required/>
			<label for="gender_f">Female</label>
			 <input type="radio" name="gender" id="gender_f" required/>
		</div>
		<div>
			<label for="cars">Car Brands</label>
			<select id="cars" name="car_brands" required>
				<option value="">--Choose anyone--</option>
				<option value="bmw">BMW</option>
				<option value="audi">Audi</option>
				<option value="mercedez">Mercedez</option>
			</select>
		</div>
		<div>
			<label for="carage">Car Age</label>
			<input id="carage" type="number" required/>
		</div>
		<div>
			<label for="dop">Date of Purchase (dop)</label>
			<input id="dop" type="date" required/>
		</div>
		<div>
			<label for="password">Password</label>
			<input id="password" type="password" required/>
		</div>
		<button type="submit">Submit</button>
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
